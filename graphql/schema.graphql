"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."

type Query {
    me: User @guard
    tasks: [Task] @guard
    task(id: ID!): Task @guard
}

type Mutation {
    signin(email: String!, password: String!): AuthPayload @resolver(class: "App\\GraphQL\\Mutations\\AuthMutation", method: "signin")
    create(title: String!, status: String!, due_date: String!): Task @guard
    update(id: ID!, title: String, status: String, due_date: String): Task @guard
    delete(id: ID!): Boolean @guard
}

type AuthPayload {
    success: Boolean!
    message: String!
    token: String
    user: User
}

type User {
    id: ID!
    name: String!
    email: String!
    created_at: String!
    updated_at: String!
}

type Task {
    id: ID!
    title: String!
    status: String!
    due_date: String!
    user: User!
    created_at: String!
    updated_at: String!
}
